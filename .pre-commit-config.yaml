# Pre-commit hooks for code quality enforcement
# See https://pre-commit.com for more information

repos:
  # General file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting with black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: black (Python formatter)
        language_version: python3.11
        files: ^backend/
        args: ['--config', 'backend/pyproject.toml']

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (import sorter)
        files: ^backend/
        args: ['--settings-path', 'backend/pyproject.toml']

  # Linting with flake8
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: flake8 (linter)
        files: ^backend/
        args: ['--config', 'backend/.flake8']
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  # Type checking with mypy (optional - run manually)
  # To run: pre-commit run mypy --all-files
  # To enable in commits: change stages to [commit]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (type checker - manual only)
        files: ^backend/
        args: ['--config-file', 'backend/pyproject.toml']
        additional_dependencies:
          - types-redis
          - types-requests
        stages: [manual]  # Only runs when explicitly called

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: bandit (security checker)
        files: ^backend/
        args: ['-c', 'backend/pyproject.toml', '-r']
        exclude: ^backend/src/test/

  # Safety check disabled - requires Poetry, not compatible with setuptools
  # To run manually: pip install safety && safety check
  # - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
  #   rev: v1.3.3
  #   hooks:
  #     - id: python-safety-dependencies-check
  #       files: ^backend/pyproject.toml$

  # Validate Python syntax
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-eval
      - id: python-use-type-annotations

  # Frontend - Prettier code formatter
  - repo: local
    hooks:
      - id: prettier-frontend
        name: prettier (frontend formatter)
        entry: bash -c 'for file in "$@"; do cd frontend && yarn prettier --write "${file#frontend/}"; cd ..; done' --
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|scss|md)$
        pass_filenames: true

  # Frontend - ESLint linter
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend linter)
        entry: bash -c 'for file in "$@"; do cd frontend && yarn eslint --fix "${file#frontend/}"; cd ..; done' --
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true

  # Frontend - TypeScript type checking (manual only)
  # To run: pre-commit run tsc-frontend --all-files
  - repo: local
    hooks:
      - id: tsc-frontend
        name: tsc (frontend type checker - manual only)
        entry: bash -c 'cd frontend && yarn tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [manual]

# Global settings
default_language_version:
  python: python3.11

# Files to exclude from all hooks
exclude: |
  (?x)^(
    .*\.egg-info/.*|
    .*\.git/.*|
    .*\.venv/.*|
    .*/__pycache__/.*|
    .*/migrations/.*|
    frontend/node_modules/.*|
    frontend/.next/.*|
    frontend/out/.*|
    logs/.*
  )$
