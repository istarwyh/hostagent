[project]
name = "deepagents"
version = "0.0.5"
description = "General purpose 'deep agent' with sub-agent spawning, todo list capabilities, and mock file system. Built on LangGraph."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=0.2.6",
    "langchain-anthropic>=0.1.23",
    "langchain>=0.2.14",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-openai>=0.1.0",
    "openai>=1.0.3",
    "pytest",
    "redis",
    "fastapi",
    "uvicorn"
]

[project.optional-dependencies]
dev = [
    # Code formatting
    "black>=24.10.0",
    "isort>=5.13.2",

    # Linting
    "flake8>=7.1.1",
    "flake8-docstrings>=1.7.0",
    "flake8-bugbear>=24.0.0",
    "flake8-comprehensions>=3.15.0",
    "flake8-simplify>=0.21.0",

    # Type checking
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "types-requests>=2.31.0",

    # Security
    "bandit>=1.7.10",
    "safety>=3.0.0",

    # Pre-commit
    "pre-commit>=4.0.0",

    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]


[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deepagents"]
[tool.setuptools.package-dir]
"deepagents" = "src/deepagents"

[tool.setuptools.package-data]
"*" = ["py.typed"]

# Black formatting configuration
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".venv", "venv", ".eggs", ".tox", "build", "dist"]

# mypy type checking configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
strict_equality = false
ignore_missing_imports = true
# Allow gradual typing adoption
allow_untyped_globals = true
allow_untyped_calls = true
allow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# bandit security checking configuration
[tool.bandit]
targets = ["src"]
exclude_dirs = ["src/test"]
skips = ["B101"]  # Skip assert_used check (OK in tests)

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["src/test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
